<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Barq to your PC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050a18">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
  :root { --bg: #050a18; --panel: #0c1630; --line: #1a2850; --fg: #eaf0ff; --mute: #9aa8c8; --accent: #2f7bff; --accent2: #38bdf8; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 0%, #10204a, var(--bg) 60%); color: var(--fg);
    font: 17px/1.6 "Segoe UI", system-ui, -apple-system, "Cairo", sans-serif; }
  .card { width: 100%; max-width: 440px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 30px 24px; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 24px; margin: 16px 0 6px; }
  p { color: var(--mute); margin: 0 0 18px; }
  .btn { display: block; width: 100%; padding: 14px 18px; border-radius: 14px; border: 0; font: inherit; font-weight: 700; text-decoration: none; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); margin-top: 10px; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 600; }
  .pc { display: inline-block; padding: 4px 12px; border-radius: 99px; background: rgba(47,123,255,.16); color: var(--accent2); font-weight: 700; margin-bottom: 14px; direction: ltr; }
  .bad { color: #f5707a; }
  small { display: block; color: var(--mute); margin-top: 18px; font-size: 13px; }
</style>
</head>
<body>
<main class="card">
  <img src="assets/img/logo.png" alt="Barq" width="88" height="88">
  <h1 id="h">Connect Barq to your PC</h1>
  <div id="pc" class="pc" hidden></div>
  <p id="p">Open this page on your Android phone, then tap the button. Barq connects to Barq for Windows on the PC.</p>
  <a id="open" class="btn" href="#">Open in Barq</a>
  <a id="get" class="btn ghost" href="index.html#download">Get Barq for Android</a>
  <small id="s">The pairing code stays on your phone: it is after "#" in the address, so it is never sent to this website.</small>
</main>
<script>
(function () {
  "use strict";
  var ar = /^ar\b/i.test(navigator.language || "");
  var T = ar ? {
    h: "وصّل برق بالكمبيوتر", p: "افتح الصفحة دي على موبايلك الأندرويد ودوس الزرار. برق هيتوصل بـ Barq for Windows على الكمبيوتر.",
    open: "افتح في برق", get: "حمّل برق للأندرويد", s: "كود الربط بيفضل على موبايلك: هو بعد علامة # في العنوان، فمش بيتبعت للموقع ده.",
    bad: "الرابط ده ناقص. افتح Barq for Windows على الكمبيوتر ← المهام ← توصيل الموبايل، وامسح الكود تاني.", pc: "الكمبيوتر: "
  } : {
    h: "Connect Barq to your PC", p: "Open this page on your Android phone, then tap the button. Barq connects to Barq for Windows on the PC.",
    open: "Open in Barq", get: "Get Barq for Android", s: "The pairing code stays on your phone: it is after \"#\" in the address, so it is never sent to this website.",
    bad: "This link is not complete. On the PC open Barq for Windows > Tasks > Connect a phone and scan the code again.", pc: "PC: "
  };
  if (ar) { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
  var $ = function (id) { return document.getElementById(id); };
  $("h").textContent = T.h; $("p").textContent = T.p; $("open").textContent = T.open; $("get").textContent = T.get; $("s").textContent = T.s;

  var q = (location.hash || "").replace(/^#/, "");
  var k = /(?:^|&)k=([A-Za-z0-9_-]{40,})/.exec(q);
  if (!k) { $("p").textContent = T.bad; $("p").className = "bad"; $("open").hidden = true; return; }
  var n = /(?:^|&)n=([^&]*)/.exec(q);
  if (n) { try { $("pc").textContent = T.pc + decodeURIComponent(n[1]); $("pc").hidden = false; } catch (e) {} }

  var app = "barq://pair?" + q;
  var android = /android/i.test(navigator.userAgent);
  // Chrome on Android: an intent link opens Barq, or this site's download section when Barq is not installed
  var link = android
    ? "intent://pair?" + q + "#Intent;scheme=barq;package=com.barq.downloadmanager;S.browser_fallback_url=" +
      encodeURIComponent(location.origin + location.pathname.replace(/pair\.html$/, "") + "#download") + ";end"
    : app;
  $("open").href = link;
  if (android) setTimeout(function () { location.href = link; }, 400);
})();
</script>
</body>
</html>
